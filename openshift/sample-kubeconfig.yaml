apiVersion: v1
kind: Config
clusters:
  - name: sno-sample
    cluster:
      server: https://api.sno.example.com:6443
      insecure-skip-tls-verify: true
users:
  - name: kubeadmin-sample
    user:
      token: sha256~replace-with-your-openshift-token
contexts:
  - name: sno-sample-admin
    context:
      cluster: sno-sample
      user: kubeadmin-sample
current-context: sno-sample-admin
